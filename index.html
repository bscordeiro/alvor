<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Alvor — a calm starting point for your next site."
    />
    <meta name="theme-color" content="#F7F8FA" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Alvor" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      try {
        document.documentElement.dataset.palette = "graphite";
        var storedTheme = localStorage.getItem("alvor-theme");
        var dark =
          storedTheme === "dark" ||
          (storedTheme !== "light" &&
            storedTheme !== "dark" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", dark ? "#121417" : "#F7F8FA");
      } catch (e) {}
    </script>
    <title>Alvor</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
